name: 遅延情報の自動更新

# JR西日本「列車走行位置」公式データから収録JR路線の遅延を定期取得する。
# 取得ボタン(アプリ内・ブラウザ直接)が最速。これはそのバックアップ。
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: update-delays
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JR西日本の運行情報を取得して変換
        run: python3 scripts/build_delays.py live/delays.json

      - name: 変更があればコミット
        run: |
          git config user.name "delay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/delays.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 遅延情報を自動更新 [skip ci]"
            git push
          fi
