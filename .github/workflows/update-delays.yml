name: 遅延情報の自動更新

# かつて定番だった無料遅延フィード「鉄道遅延情報のjson」は2022年5月に終了。
# 代替フィードを DELAY_FEED_URL に設定したら schedule を有効化する。
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/30 * * * *'

permissions:
  contents: write

concurrency:
  group: update-delays
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      # 連携先フィードのURL(JSON配列 [{name, company, lastupdate_gmt}, ...] 形式を想定)
      DELAY_FEED_URL: ''
    steps:
      - uses: actions/checkout@v4

      - name: 遅延フィードを取得して変換
        run: |
          if [ -z "$DELAY_FEED_URL" ]; then
            echo "DELAY_FEED_URL が未設定のためスキップします"
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 \
            -A "norinavi-demo (https://github.com/sfuskusoska/norinavi)" \
            "$DELAY_FEED_URL" -o /tmp/delay.json \
            || { echo "取得失敗(前回データを維持して終了)"; exit 0; }
          python3 scripts/build_delays.py /tmp/delay.json live/delays.json

      - name: 変更があればコミット
        run: |
          git config user.name "delay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/delays.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: 遅延情報を自動更新"
            git push
          fi
